landing:
  alert:
    description: >-
      こちらは SA が内部デモのために利用する環境です。カスタマーにデモをする場合は、原則自分の AWS アカウントにデプロイしたものを利用してください。カスタマーのデータの入力や業務利用をしてはいけません。
    title: GenU デモ環境について
  demo:
    agent:
      content: ダミーデータで散布図を描いてください。
    chat:
      content: >-
        フィボナッチ数を返す Python の関数を書いてください。また、実装を解説してください。
        引数が項で、処理は再帰で書くようにしてください。出力はマークダウンにしてください。
    diagram:
      content: 会社の一般的な経費生産フローを色つきで図示してください。
    generate:
      context: >-
        Amazon Bedrock は、AI21 Labs、Anthropic、Cohere、Meta、Stability AI、Amazon
        などの大手 AI 企業が提供する高性能な基盤モデル (FM) を単一の API で選択できるフルマネージド型サービスです。 また、生成 AI
        アプリケーションの構築に必要な幅広い機能も備えているため、プライバシーとセキュリティを維持しながら開発を簡素化できます。 Amazon
        Bedrock の包括的な機能を使用すると、さまざまなトップ FM を簡単に試したり、微調整や検索拡張生成 (RAG)
        などの手法を使用してデータを使用してプライベートにカスタマイズしたり、旅行の予約や保険金請求の処理から広告キャンペーンの作成や在庫管理まで、複雑なビジネスタスクを実行するマネージドエージェントを作成したりできます。
        これらはすべて、コードを記述することなく行えます。Amazon Bedrock
        はサーバーレスであるため、インフラストラクチャを管理する必要がありません。 また、使い慣れた AWS サービスを使用して、生成 AI
        機能をアプリケーションに安全に統合してデプロイできます。
      information: プレゼンテーションのために、マークダウン形式で章立てして、それぞれ端的に説明を
    image:
      content: >-
        スマホ広告のデザイン案を出力してください。
        可愛い、おしゃれ、使いやすい、POPカルチャー、親しみやすい、若者向け、音楽、写真、流行のスマホ、背景が街
    mcp:
      content: >-
        Amazon Bedrock のセキュリティについて調べてください。ユーザーの入力はモデルの学習に使われますか？
    rag:
      content: Claude のパラメータを説明し、その設定方法も教えてください。
    summarize:
      sentence: >-
        Amazon Bedrock は、Amazon や主要な AI スタートアップ企業が提供する基盤モデル (FM) を API
        を通じて利用できるようにする完全マネージド型サービスです。 そのため、さまざまな FM
        から選択して、ユースケースに最も適したモデルを見つけることができます。 Amazon Bedrock
        のサーバーレスエクスペリエンスにより、すぐに FM を開始したり、FM を簡単に試したり、独自のデータを使用して FM
        をプライベートにカスタマイズしたり、AWS のツールや機能を使用して FM をアプリケーションにシームレスに統合してデプロイしたりできます。
        Amazon Bedrock
        のエージェントは、開発者が独自の知識源に基づいて最新の回答を提供し、幅広いユースケースのタスクを完了できるジェネレーティブ AI
        アプリケーションを開発者が簡単に作成できるようにする完全マネージド機能です。 Bedrock
        のサーバーレスエクスペリエンスにより、インフラストラクチャを管理することなく、すぐに使用を開始し、独自のデータを使用して FM
        をプライベートにカスタマイズし、使い慣れた AWS ツールや機能を使用してそれらをアプリケーションに簡単に統合してデプロイできます
        (さまざまなモデルをテストするための実験や FM を大規模に管理するためのパイプラインなどの Amazon SageMaker の ML
        機能との統合を含みます)。
    translate:
      language: en
      sentence: こんにちは。私は翻訳を支援する AI アシスタントです。お好きな文章を入力してください。
    video:
      content: 映っているものを説明してください。もし映っているものに文字が書かれている場合はそれも読んでください。
    web_content:
      url: https://aws.amazon.com/jp/bedrock/
  title: ではじめる生成 AI
  try: 試す
  try_message: をクリックすることで、各ユースケースを体験できます。
  use_cases:
    agent_chat:
      description: >-
        Agent チャットユースケースでは Agents for Amazon Bedrock を利用してアクションを実行させたり、Knowledge
        Bases for Amazon Bedrock のベクトルデータベースを参照することが可能です。
      title: Agent チャット
    chat:
      description: >-
        LLM
        とチャット形式で対話することができます。細かいユースケースや新しいユースケースに迅速に対応することができます。プロンプトエンジニアリングの検証用環境としても有効です。
      title: チャット
    diagram:
      description: >-
        自然言語による説明、文書やコードから、フローチャート、シーケンス図、マインドマップなどの様々な図を自動的に作成できます。システム設計、ビジネスフロー、プロジェクト計画などの複雑な関係性を、視覚的に表現し理解を効率化します。
      title: ダイアグラム生成
    flow_chat:
      description: >-
        Flow
        を使用して、複数のステップを持つ対話型チャットフローを作成します。ユーザーの入力に基づいて、動的に次のステップを決定し、より複雑な対話シナリオを実現します。
      title: Flow チャット
    generate_text:
      description: >-
        あらゆるコンテキストで文章を生成することは LLM が最も得意とするタスクの 1
        つです。記事・レポート・メールなど、あらゆるコンテキストに対応します。
      title: 文章生成
    image:
      description: >-
        画像生成 AI
        は、テキストや画像を元に新しい画像を生成できます。アイデアを即座に可視化することができ、デザイン作業などの効率化を期待できます。こちらの機能では、プロンプトの作成を
        LLM に支援してもらうことができます。
      title: 画像生成
    mcp_chat:
      description: >-
        MCP チャットは  Model Context Protocol (MCP) を通じて、Bedrock の LLM モデルと外部データや外部ツールをシームレスに連携させるチャット機能です。mcp.json を編集することで、自由にツールを追加できます。MCP のエージェントとして Strands Agents を活用しています。
      title: MCP チャット
    meeting-minutes:
      description: >-
        音声録音またはリアルタイム文字起こしから議事録を自動生成します。
        プロンプトを書く必要はなく、原文に近い文字起こし、新聞記事、FAQ形式から選択できます。
      title: 議事録生成
    rag_chat:
      description_kb: >-
        RAG (Retrieval Augmented Generation) は、情報の検索と LLM
        の文章生成を組み合わせる手法のことで、効果的な情報アクセスを実現できます。 Knowledge Base の Hybrid Search
        を利用して参考ドキュメントを取得し、LLM が回答を生成します。
      description_kendra: >-
        RAG (Retrieval Augmented Generation) は、情報の検索と LLM
        の文章生成を組み合わせる手法のことで、効果的な情報アクセスを実現できます。 Amazon Kendra から取得した参考ドキュメントをベースに
        LLM が回答を生成してくれるため、「社内情報に対応した LLM チャット」を簡単に実現することが可能です。
      sub_kb: Knowledge Base
      sub_kendra: Amazon Kendra
      title: RAG チャット
    summarize:
      description: >-
        LLM
        は、大量の文章を要約するタスクを得意としています。要約する際に「1行で」や「子供でもわかる言葉で」などコンテキストを与えることができます。
      title: 要約
    translate:
      description: >-
        多言語で学習した LLM
        は、翻訳を行うことも可能です。また、ただ翻訳するだけではなく、カジュアルさ・対象層など様々な指定されたコンテキスト情報を翻訳に反映させることが可能です。
      title: 翻訳
    video-analysis:
      description: >-
        マルチモーダルモデルによってテキストのみではなく、画像を入力することが可能になりました。こちらの機能では、映像の画像フレームとテキストを入力として
        LLM に分析を依頼します。
      title: 映像分析
    video-generation:
      description: 動画生成 AI はテキストから短い動画を生成します。生成した動画は素材としてさまざまなシーンで活用できます。
      title: 動画生成
    voice_chat:
      description: >-
        音声チャットでは生成 AI と双方向の音声によるチャットが可能です。 自然な会話と同様、AI の発言中に割り込んで話すこともできます。
        また、システムプロンプトを設定することで、特定の役割を持った AI と音声で会話することもできます。
      title: 音声チャット
    web_content:
      description: >-
        ブログやドキュメントなどの Web コンテンツを抽出します。LLM
        によって不要な情報はそぎ落とし、成立した文章として整形します。抽出したコンテンツは要約、翻訳などの別のユースケースで利用できます。
      title: Web コンテンツ抽出
    writer:
      description: ライティングの支援、文章の推敲、校閲を行うツールです。AI の支援を得ながら効率的に執筆することができます。
      title: 執筆
  use_cases_integration:
    blog:
      description: >-
        複数のユースケースを組み合わせて、ブログ記事を生成します。記事の概要とサムネイル画像も自動生成することで、OGP
        の設定も容易になります。例として、AWS 公式サイトの情報を元に生成 AI を紹介するブログ記事を生成します。
      title: ブログ記事作成
    meeting:
      description: >-
        複数のユースケースを組み合わせて、会議の録音データから議事録を自動作成します。録音データの文字起こし、文字起こし結果の整形、議事録作成を人的コストをかけずに行うことが可能です。
      title: 議事録作成
    title: ユースケース連携
  use_cases_title: ユースケース一覧
