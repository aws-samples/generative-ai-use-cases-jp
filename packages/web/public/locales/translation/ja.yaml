  help:
    emailReplyExample: メール返信の例
    emailReplyPrompt: |-
      あなたは、メール返信の担当者です。
      以下のルールを守って、返信用のメールを作成してください。
      <ルール>
      - 取引先へのメールです。敬語を使う必要がありますが、関係構築ができているので、かしこまりすぎた文章である必要はありません。
      - 返信対象メールの内容を理解し、返信内容に沿った返信用メールを作成してください。
      - 返信対象メールと返信内容から読み取れないことは、絶対にメール文に含めないでください。
