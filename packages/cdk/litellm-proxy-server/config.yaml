# General settings
general_settings:
  master_key: sk-litellm-master-key # Master key for LiteLLM admin access
  database_url: null # Optional - can be added for logging/analytics

# Proxy settings
litellm_settings:
  success_callback: []
  failure_callback: []
  cache: false
  cache_params: null
  default_team_settings: null

# Health check settings
health_check: true
# Optional: Router settings for load balancing
# router_settings:
#   routing_strategy: simple-shuffle  # Options: simple-shuffle, least-busy, usage-based-routing
#   cooldown_time: 60  # Time in seconds to cooldown a model if it fails
#   num_retries: 2  # Number of retries for failed requests
#   allowed_fails: 3  # Number of allowed fails before cooldown

# Optional: Set model aliases
# model_alias:
#   "gpt-4": "claude-3-5-sonnet"  # Redirect gpt-4 requests to Claude

# Optional: Set spend tracking
# litellm_settings:
#   max_budget: 100  # Maximum budget in USD
#   budget_duration: 30d  # Budget duration (e.g., 30d, 1m, 1y)
