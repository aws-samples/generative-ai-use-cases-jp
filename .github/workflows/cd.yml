name: CD

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment:
      name: Production
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Configure AWS Credentials via OIDC
        id: configure-aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Install dependencies
        run: npm ci

      - name: Decode CDK Config
        env:
          CDK_CONFIG_BASE64: ${{ secrets.CDK_CONFIG_BASE64 }}
        run: |
          echo "$CDK_CONFIG_BASE64" | base64 -d > packages/cdk/cdk.json

      - name: Bootstrap CDK
        run: npm -w packages/cdk run cdk -- bootstrap --verbose
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.configure-aws.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ steps.configure-aws.outputs.aws-region }}

      - name: Deploy CDK Stacks
        run: npm -w packages/cdk run cdk -- deploy --all --require-approval never --verbose
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.configure-aws.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ steps.configure-aws.outputs.aws-region }}

      - name: Validate Deployment
        run: |
          npm -w packages/cdk run cdk -- ls
          aws sts get-caller-identity
